<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PICKELS STORE - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #f5efe0, #fffaf2, #e9f0e6);
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            font-size: 48px;
        }

        .login-brand h1 {
            margin: 5px 0;
            color: #173d2b;
            font-family: Georgia, serif;
            font-size: 32px;
        }

        .login-brand h1 span {
            color: #c38d24;
        }

        .login-brand p {
            color: #737a74;
            font-size: 14px;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 55px rgba(23, 61, 43, 0.14);
        }

        .login-card h2 {
            margin: 0 0 8px;
            text-align: center;
            color: #173d2b;
            font-family: Georgia, serif;
            font-size: 27px;
        }

        .login-subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .login-error {
            background: #fff0f0;
            color: #b42318;
            border: 1px solid #f3c2c2;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .login-field {
            margin-bottom: 20px;
        }

        .login-field label {
            display: block;
            color: #24352b;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .login-field input {
            width: 100%;
            height: 48px;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #dcded8;
            border-radius: 11px;
            background: #fbfcf9;
            color: #24352b;
            font-size: 15px;
            outline: none;
        }

        .login-field input:focus {
            background: white;
            border-color: #c38d24;
            box-shadow: 0 0 0 3px rgba(195, 141, 36, 0.12);
        }

        /* PASSWORD SHOW / HIDE */

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 19px;
            padding: 5px;
        }

        .login-button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            background: #173d2b;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #285c41;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: 14px;
            color: #173d2b;
            text-decoration: underline;
            font-weight: 600;
            font-size: 14px;
        }

        .forgot-link:hover {
            color: #c38d24;
        }

        .security-note {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-top: 16px;
        }

        .register-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #173d2b;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .register-link:hover {
            color: #c38d24;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #173d2b;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 25px 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='3d-ui.css', v='20261009-professional1') }}">
</head>

<body>

<div class="login-page">

    <div class="login-wrapper">

        <!-- BRAND -->
        <div class="login-brand">

            <div class="brand-icon">🥭</div>

            <h1>
                PICKELS <span>STORE</span>
            </h1>

            <p>
                Authentic taste, delivered to your doorstep.
            </p>

        </div>


        <!-- LOGIN CARD -->
        <div class="login-card">

            <h2>Welcome Back</h2>

            <p class="login-subtitle">
                Login to your account
            </p>


            {% if error %}
                <div class="login-error">
                    ⚠️ {{ error }}
                </div>
            {% endif %}


            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- MOBILE NUMBER -->
                <div class="login-field">

                    <label for="mobile">
                        📱 Mobile Number
                    </label>

                    <input
                        id="mobile"
                        type="tel"
                        name="mobile"
                        placeholder="Enter 10-digit mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        pattern="[0-9]{10}"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="login-field">

                    <label for="password">
                        🔑 Password
                    </label>

                    <div class="password-box">

                        <input
                            id="password"
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            minlength="6"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            data-toggle-password="password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- LOGIN -->
                <button
                    type="submit"
                    class="login-button"
                >
                    🔐 Login
                </button>

            </form>


            <a href="/forgot-password" class="forgot-link">
                Forgot Password?
            </a>

            <div class="security-note">
                🔒 Your account is protected with password security.
            </div>


            <a href="/register" class="register-link">
                New customer? Create an account
            </a>

        </div>


        <a href="/" class="back-home">
            ← Back to PICKELS STORE
        </a>

    </div>

</div>


<script src="{{ url_for('static', filename='security-ui.js') }}"></script>

</body>
</html>
