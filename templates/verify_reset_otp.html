<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PICKELS STORE - Verify OTP</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .otp-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .otp-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .otp-card h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .otp-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .otp-error {
            background: #ffe8e8;
            color: #b00020;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }

        .otp-field {
            margin-bottom: 20px;
        }

        .otp-field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .otp-field input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 22px;
            text-align: center;
            letter-spacing: 8px;
            box-sizing: border-box;
        }

        .otp-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #173d2b;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .otp-note {
            text-align: center;
            margin-top: 18px;
            color: #777;
            font-size: 14px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #173d2b;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='3d-ui.css', v='20261010-sitewide3') }}">
</head>

<body>

<div class="otp-page">

    <div class="otp-card">

        <h2>📱 Verify OTP</h2>

        <p class="otp-subtitle">
            Enter the OTP sent to your mobile number
        </p>

        {% if error %}
        <div class="otp-error">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="otp-field">

                <label for="otp">
                    Enter 6-digit OTP
                </label>

                <input
                    id="otp"
                    type="text"
                    name="otp"
                    maxlength="6"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    placeholder="••••••"
                    required
                >

            </div>

            <button
                type="submit"
                class="otp-button"
            >
                ✅ Verify OTP
            </button>

        </form>

        <div class="otp-note">
            🔒 OTP is valid for 5 minutes.
        </div>

        <a
            href="/forgot-password"
            class="back-link"
        >
            ← Try Again
        </a>

    </div>

</div>

</body>
</html>
