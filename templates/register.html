<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PICKELS STORE - Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #f5efe0, #fffaf2, #e9f0e6);
        }

        .register-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .register-brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .register-brand .brand-icon {
            font-size: 48px;
        }

        .register-brand h1 {
            margin: 5px 0;
            color: #173d2b;
            font-family: Georgia, serif;
            font-size: 32px;
        }

        .register-brand h1 span {
            color: #c38d24;
        }

        .register-brand p {
            color: #737a74;
            font-size: 14px;
        }

        .register-card {
            background: white;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 55px rgba(23, 61, 43, 0.14);
        }

        .register-card h2 {
            margin: 0 0 8px;
            text-align: center;
            color: #173d2b;
            font-family: Georgia, serif;
            font-size: 27px;
        }

        .register-subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .register-error {
            background: #fff0f0;
            color: #b42318;
            border: 1px solid #f3c2c2;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .register-field {
            margin-bottom: 18px;
        }

        .register-field label {
            display: block;
            color: #24352b;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .register-field input,
        .register-field textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #dcded8;
            border-radius: 11px;
            background: #fbfcf9;
            color: #24352b;
            font-size: 15px;
            outline: none;
        }

        .register-field input {
            height: 48px;
        }

        .register-field textarea {
            min-height: 90px;
            resize: vertical;
        }

        .register-field input:focus,
        .register-field textarea:focus {
            background: white;
            border-color: #c38d24;
            box-shadow: 0 0 0 3px rgba(195, 141, 36, 0.12);
        }

        /* PASSWORD SHOW/HIDE */

        .password-box {
            position: relative;
            width: 100%;
        }

        .password-box input {
            padding-right: 50px !important;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 19px;
            padding: 5px;
        }

        .show-password:hover {
            transform: translateY(-50%) scale(1.1);
        }

        .register-button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            background: #173d2b;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .register-button:hover {
            background: #285c41;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(23, 61, 43, 0.18);
        }

        .otp-note {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-top: 16px;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #173d2b;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .login-link:hover {
            color: #c38d24;
        }

        @media (max-width: 500px) {
            .register-page {
                padding: 25px 15px;
            }

            .register-card {
                padding: 25px 20px;
                border-radius: 20px;
            }

            .register-brand h1 {
                font-size: 28px;
            }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='3d-ui.css', v='20261010-sitewide3') }}">
</head>

<body>

<div class="register-page">

    <div class="register-wrapper">

        <!-- BRAND -->
        <div class="register-brand">

            <div class="brand-icon">🥭</div>

            <h1>
                PICKELS <span>STORE</span>
            </h1>

            <p>
                Authentic taste, delivered to your doorstep.
            </p>

        </div>


        <!-- REGISTER CARD -->
        <div class="register-card">

            <h2>Create Account</h2>

            <p class="register-subtitle">
                Register with your mobile number
            </p>


            {% if error %}
                <div class="register-error">
                    ⚠️ {{ error }}
                </div>
            {% endif %}


            <form method="POST">

                <!-- NAME -->
                <div class="register-field">

                    <label for="name">
                        👤 Full Name
                    </label>

                    <input
                        id="name"
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- MOBILE -->
                <div class="register-field">

                    <label for="mobile">
                        📱 Mobile Number
                    </label>

                    <input
                        id="mobile"
                        type="tel"
                        name="mobile"
                        placeholder="Enter 10-digit mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        pattern="[0-9]{10}"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- ADDRESS -->
                <div class="register-field">

                    <label for="address">
                        📍 Delivery Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter your complete delivery address"
                        autocomplete="street-address"
                        required
                    ></textarea>

                </div>


                <!-- PASSWORD -->
                <div class="register-field">

                    <label for="password">
                        🔑 Password
                    </label>

                    <div class="password-box">

                        <input
                            id="password"
                            type="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', this)"
                            aria-label="Show password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="register-field">

                    <label for="confirm_password">
                        🔐 Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            id="confirm_password"
                            type="password"
                            name="confirm_password"
                            placeholder="Re-enter your password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirm_password', this)"
                            aria-label="Show confirm password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- REGISTER BUTTON -->
                <button
                    type="submit"
                    class="register-button"
                >
                    📱 Send OTP & Register
                </button>

            </form>


            <div class="otp-note">
                🔒 An OTP will be sent to your mobile number.
            </div>


            <a href="/login" class="login-link">
                Already have an account? Login
            </a>

        </div>

    </div>

</div>


<!-- PASSWORD TOGGLE SCRIPT -->
<script>
function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";
        button.textContent = "🙈";

    } else {

        input.type = "password";
        button.textContent = "👁️";

    }
}
</script>

</body>
</html>
