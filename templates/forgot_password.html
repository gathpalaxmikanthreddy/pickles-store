<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PICKELS STORE - Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .forgot-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .forgot-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .forgot-card h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .forgot-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .forgot-error {
            background: #ffe8e8;
            color: #b00020;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }

        .forgot-field {
            margin-bottom: 20px;
        }

        .forgot-field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .forgot-field input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .forgot-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #173d2b;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .forgot-button:hover {
            opacity: 0.9;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #173d2b;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='3d-ui.css', v='20261010-sitewide3') }}">
</head>

<body>

<div class="forgot-page">

    <div class="forgot-card">

        <h2>🔐 Forgot Password?</h2>

        <p class="forgot-subtitle">
            Enter your registered mobile number
        </p>

        {% if error %}
        <div class="forgot-error">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="forgot-field">

                <label for="mobile">
                    📱 Mobile Number
                </label>

                <input
                    id="mobile"
                    type="tel"
                    name="mobile"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    pattern="[0-9]{10}"
                    required
                >

            </div>

            <button
                type="submit"
                class="forgot-button"
            >
                📱 Send OTP
            </button>

        </form>

        <a
            href="/login"
            class="back-login"
        >
            ← Back to Login
        </a>

    </div>

</div>

</body>
</html>
