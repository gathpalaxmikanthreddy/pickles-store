<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PICKELS STORE - Reset Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .reset-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .reset-card h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .reset-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .reset-error {
            background: #ffe8e8;
            color: #b00020;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }

        .reset-field {
            margin-bottom: 20px;
        }

        .reset-field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            width: 100%;
            padding: 13px 48px 13px 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .show-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 20px;
        }

        .reset-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #173d2b;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .reset-button:hover {
            opacity: 0.9;
        }

        .reset-note {
            text-align: center;
            margin-top: 18px;
            color: #777;
            font-size: 14px;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='3d-ui.css', v='20261010-sitewide3') }}">
</head>

<body>

<div class="reset-page">

    <div class="reset-card">

        <h2>🔐 Reset Password</h2>

        <p class="reset-subtitle">
            Create your new password
        </p>

        {% if error %}
        <div class="reset-error">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="reset-field">

                <label for="password">
                    🔑 New Password
                </label>

                <div class="password-box">

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Enter new password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('password', this)"
                    >
                        👁️
                    </button>

                </div>

            </div>

            <div class="reset-field">

                <label for="confirm_password">
                    🔑 Confirm Password
                </label>

                <div class="password-box">

                    <input
                        id="confirm_password"
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirm_password', this)"
                    >
                        👁️
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="reset-button"
            >
                🔄 Change Password
            </button>

        </form>

        <div class="reset-note">
            🔒 Password must be at least 6 characters.
        </div>

    </div>

</div>

<script>
function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";
        button.textContent = "🙈";

    } else {

        input.type = "password";
        button.textContent = "👁️";

    }
}
</script>

</body>
</html>
